name: Deploy with Helm

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: lab

      - name: Deploy with Helm
        run: |
          helm upgrade --install demo . \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/helm-cicd-lab \
            --set image.tag=latest \
            --wait --timeout 120s

      - name: Smoke test
        run: |
          kubectl rollout status deployment/demo --timeout=60s
          kubectl port-forward svc/demo 8080:80 &
          sleep 5
          curl -fsS http://localhost:8080/

      - name: Show release
        if: always()
        run: |
          helm list
          kubectl get pods -o wide
